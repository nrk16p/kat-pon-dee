# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → point at nrk16p/be-kat-pon-dee.
# The backend is the repo root there, so no rootDir is needed.
services:
  - type: web
    name: kat-pon-dee-api
    runtime: python
    region: singapore          # closest region to Thailand
    plan: standard             # 2 GB RAM. See the note below before downgrading.
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /api/health

    # Captures are the training set for the segmentation model that has to
    # replace the watershed baseline. Render's container filesystem is WIPED ON
    # EVERY DEPLOY, so without this disk the dataset is destroyed each time you
    # ship — silently, and unrecoverably.
    disk:
      name: captures
      mountPath: /data
      sizeGB: 10

    envVars:
      - key: PYTHON_VERSION
        value: '3.12.7'
      - key: CAPTURE_DIR
        value: /data/captures
      - key: FAILED_DIR
        value: /data/failed
      - key: GROWERS_FILE
        value: /data/growers.jsonl
      # Counting tallies. On the disk for the same reason as everything else,
      # but this one is worse to lose: the farmer already read the number off
      # the screen and believes it.
      - key: SESSION_DIR
        value: /data/sessions
      - key: RETAIN_CAPTURES
        value: '1'
      # One capture peaks near 0.5 GB; two at once would OOM anything small.
      - key: MAX_CONCURRENT_JOBS
        value: '1'
      # 8 px/mm: peak 482 MB, bias -0.05 mm.  Drop to 5 for a 512 MB instance
      # (peak 339 MB) and accept -0.17 mm.
      - key: RECT_PX_PER_MM
        value: '8.0'
      # Live counting frames. NOT the same as RECT_PX_PER_MM: at preview
      # resolution 8 px/mm upsamples past the information actually in the frame,
      # reads +0.4 mm high, and costs 10x the time for it.
      - key: LIVE_PX_PER_MM
        value: '2.5'
      - key: CORS_ORIGINS
        sync: false            # set to the Vercel URL in the dashboard
      # Shared secret for the write endpoints. Set it before any tunnel or
      # public URL exists, or anyone holding the address can fill the disk.
      - key: API_TOKEN
        sync: false
